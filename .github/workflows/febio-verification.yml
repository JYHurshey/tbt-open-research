name: Published cervical reference acquisition
on:
  push:
    branches: [verification/febio-runtime-20261019]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Acquire public noncommercial reference models and source examples
        run: |
          mkdir -p evidence
          cat > acquire_references.py <<'PY'
          import pathlib,urllib.request,urllib.parse,json,re,html,hashlib,zipfile,time
          P=pathlib.Path('evidence'); manifest={'research_only':True,'tbt_validation':False,'retrieved_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'files':[],'failures':[]}
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Cervical-reference-research/1.0'})
              with urllib.request.urlopen(req,timeout=150) as r:return r.read(),r.geturl()
          def save(url,name):
              b,final=fetch(url);q=P/name;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(b)
              manifest['files'].append({'path':name,'source':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)});return b
          # License was displayed by the author on the public distribution page.
          license_text='Copyright (c) 2019 University of Utah. Herron MR, Park J, Dailey AT, Brockmeyer DL, Ellis BJ. FEBio finite element models of the human cervical spine. J Biomech 2020;113:110077. DOI:10.1016/j.jbiomech.2020.110077. Distributed by the authors at https://simtk.org/projects/febiocervical under Creative Commons Attribution-NonCommercial 3.0: https://creativecommons.org/licenses/by-nc/3.0/ . These are source reference models, not population averages or validated TBT models. No endorsement is implied.'
          (P/'CERVICAL_MODEL_ATTRIBUTION.txt').write_text(license_text)
          for fid,age in [(5742,'26'),(5743,'59'),(5744,'64')]:
              url=f'https://simtk.org/frs/download_confirm.php/file/{fid}/{age}yoF_model.zip?group_id=1688'
              try:
                  b=save(url,f'pages/{age}_download_confirmation.html')
                  if b[:2]==b'PK':
                      (P/f'{age}yoF_model.zip').write_bytes(b)
                  else:
                      text=html.unescape(b.decode('utf-8','replace'))
                      links=re.findall(r'(?:href|action)=[\"\x27]([^\"\x27]+)',text)
                      candidates=[urllib.parse.urljoin(url,s) for s in links if 'download.php' in s and str(fid) in s]
                      if not candidates: raise RuntimeError('No public direct download link in confirmation page')
                      b=save(candidates[0],f'{age}yoF_model.zip')
                  if not zipfile.is_zipfile(P/f'{age}yoF_model.zip'): raise RuntimeError('Response not a ZIP model archive')
              except Exception as e: manifest['failures'].append({'source':url,'error':str(e)})
          base='https://raw.githubusercontent.com/febiosoftware/TestSuite/a6fd1d0372dbbb9afc7e84a0538b001c7b1cc0f7/'
          for name in ['Verify/ri11.feb','README.md','LICENSE']:
              try:save(base+name,'testsuite/'+name)
              except Exception as e:manifest['failures'].append({'source':base+name,'error':str(e)})
          try:
              url='https://api.github.com/repos/febiosoftware/TestSuite/git/trees/a6fd1d0372dbbb9afc7e84a0538b001c7b1cc0f7?recursive=1'
              save(url,'testsuite_tree.json')
          except Exception as e:manifest['failures'].append({'source':url,'error':str(e)})
          for url,name in [('https://simtk.org/frs/?group_id=1688','pages/distribution.html'),('https://simtk.org/docman/?group_id=1688','pages/documents.html'),('https://raw.githubusercontent.com/febiosoftware/FEBio/v4.13/LICENSE','FEBio_source_LICENSE')]:
              try:save(url,name)
              except Exception as e:manifest['failures'].append({'source':url,'error':str(e)})
          (P/'sources_manifest.json').write_text(json.dumps(manifest,indent=2));print(json.dumps(manifest,indent=2))
          PY
          python acquire_references.py
          cp acquire_references.py evidence/
      - name: Preserve public reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-cervical-reference-evidence
          path: evidence/
          retention-days: 7
