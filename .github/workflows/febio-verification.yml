name: Public FEBio repository reference discovery
on:
  push:
    branches: [verification/febio-runtime-20261019]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read public model metadata, without accounts or protected downloads
        run: |
          mkdir -p evidence
          python - <<'PY'
          import pathlib,urllib.request,json,hashlib,re
          P=pathlib.Path('evidence'); report=[]
          urls=[('https://repo.febio.org/modelRepo/metadata-User%20Projects.js','user_projects_metadata.js'),('https://repo.febio.org/modelRepo/metadata-Test%20Suite.js','test_metadata.js')]
          for url,name in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'FEBio-cervical-reference-research/1.0'}),timeout=60) as r: b=r.read()
                  (P/name).write_bytes(b);report.append({'url':url,'file':name,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
              except Exception as e:report.append({'url':url,'error':str(e)})
          (P/'provenance.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - name: Save public metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-febio-model-metadata
          path: evidence/
          retention-days: 7
